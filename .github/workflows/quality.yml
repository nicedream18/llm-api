name: quality

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85 -q
        env:
          WALIAPI_TEST_MYSQL_HOST: 127.0.0.1
          WALIAPI_TEST_MYSQL_PORT: 3306
          WALIAPI_TEST_MYSQL_PASSWORD: root
      - run: ruff check app tests
      - run: mypy --follow-imports=silent app
      - run: python -m compileall -q app tests
      - run: node --test tests/frontend/*.test.cjs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
